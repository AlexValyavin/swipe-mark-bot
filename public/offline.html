<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10121c" />
    <title>SwipeMark — нет соединения</title>
    <style>
      :root {
        --bg: #10121c;
        --surface: #1c1c1d;
        --text: #ffffff;
        --muted: #999999;
        --accent: #6366f1;
        --accent-text: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      h1 { font-size: 18px; font-weight: 600; }
      p {
        font-size: 13px;
        color: var(--muted);
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>Нет соединения</h1>
    <p>Офлайн-оболочка загружена, но данные требуют интернета. Проверь соединение и попробуй ещё раз.</p>
    <button onclick="location.reload()">Обновить</button>
  </body>
</html>
